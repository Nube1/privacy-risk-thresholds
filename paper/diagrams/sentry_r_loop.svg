<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
 <title>SENTRY-R proposal, measured training, and independent audit</title>
 <defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
   <rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#9a9a9a" stroke-width="2"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222222"/></marker>
 </defs>
 <rect width="900" height="360" fill="#fff"/>
 <!-- development side: light grey fill, solid border -->
 <g font-family="Arial, sans-serif" font-size="17" fill="#111111">
  <rect x="24" y="32" width="250" height="84" rx="10" fill="#e6e6e6" stroke="#222222" stroke-width="2"/>
  <text x="43" y="64" font-weight="bold">LLM scenario proposal</text><text x="43" y="91" font-size="14">schema + named review</text>
  <rect x="325" y="32" width="250" height="84" rx="10" fill="#e6e6e6" stroke="#222222" stroke-width="2"/>
  <text x="343" y="64" font-weight="bold">Observed attacks</text><text x="343" y="91" font-size="14">measured development counts</text>
  <rect x="626" y="32" width="250" height="84" rx="10" fill="#e6e6e6" stroke="#222222" stroke-width="2"/>
  <text x="644" y="64" font-weight="bold">Deep proposal model</text><text x="644" y="91" font-size="14">rank candidate settings</text>
 </g>
 <!-- audit side: white with diagonal hatch, heavy dashed border -->
 <g font-family="Arial, sans-serif" font-size="17" fill="#111111">
  <rect x="626" y="208" width="250" height="84" rx="10" fill="url(#hatch)" stroke="#000000" stroke-width="3" stroke-dasharray="9 5"/>
  <rect x="640" y="219" width="222" height="62" fill="#ffffff"/>
  <text x="652" y="243" font-weight="bold">Fresh attack audit</text><text x="652" y="268" font-size="14">simultaneous risk bounds</text>
  <rect x="325" y="208" width="250" height="84" rx="10" fill="url(#hatch)" stroke="#000000" stroke-width="3" stroke-dasharray="9 5"/>
  <rect x="339" y="219" width="222" height="62" fill="#ffffff"/>
  <text x="351" y="243" font-weight="bold">Release decision</text><text x="351" y="268" font-size="14">all coordinates must pass</text>
 </g>
 <g fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)">
  <path d="M275 74 H318"/><path d="M576 74 H619"/><path d="M751 117 V200"/><path d="M624 250 H582"/>
 </g>
 <text x="30" y="165" fill="#333333" font-family="Arial, sans-serif" font-size="15">Proposal text never supplies training labels or a release certificate.</text>
 <!-- legend: each side differs by fill shade and by border style -->
 <g font-family="Arial, sans-serif" font-size="14" fill="#111111">
  <rect x="30" y="318" width="34" height="22" rx="4" fill="#e6e6e6" stroke="#222222" stroke-width="2"/>
  <text x="74" y="334">development (grey fill, solid border)</text>
  <rect x="380" y="318" width="34" height="22" rx="4" fill="url(#hatch)" stroke="#000000" stroke-width="3" stroke-dasharray="9 5"/>
  <text x="424" y="334">independent audit (hatched, dashed border)</text>
 </g>
</svg>
