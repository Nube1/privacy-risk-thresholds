<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#21334a"/></marker></defs><style>text{font:20px Arial,sans-serif;fill:#182b41}</style><rect x="65" y="45" width="340" height="115" rx="8" fill="white" stroke="#21334a" stroke-width="2"/><text x="235.0" y="74.5" text-anchor="middle">Release 1</text><text x="235.0" y="102.5" text-anchor="middle">A1 = {target, u, v}</text><text x="235.0" y="130.5" text-anchor="middle">risk = 1/3</text><rect x="595" y="45" width="340" height="115" rx="8" fill="white" stroke="#21334a" stroke-width="2"/><text x="765.0" y="74.5" text-anchor="middle">Release 2</text><text x="765.0" y="102.5" text-anchor="middle">A2 = {target, w, x}</text><text x="765.0" y="130.5" text-anchor="middle">risk = 1/3</text><path d="M235,160 L440,215" fill="none" stroke="#21334a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M765,160 L560,215" fill="none" stroke="#21334a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="355" y="215" width="290" height="105" rx="8" fill="white" stroke="#21334a" stroke-width="3"/><text x="500.0" y="239.5" text-anchor="middle">Pooled intersection</text><text x="500.0" y="267.5" text-anchor="middle">A1 ∩ A2 = {target}</text><text x="500.0" y="295.5" text-anchor="middle">risk = 1</text><text x="500" y="365" text-anchor="middle">The marginal union limit, 2/3, does not bound pooled risk.</text></svg>
