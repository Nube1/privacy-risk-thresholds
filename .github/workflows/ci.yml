name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python scripts/multiscale_demo.py --output /tmp/multiscale-demo.json
      - run: pytest
      - run: python scripts/validate_notebook.py
      - run: privacy-risk-run --config configs/base.json --output artifacts
      - run: python scripts/realdata_replication.py --output /tmp/realdata-replication.json
      - run: python scripts/realdata_neural_pilot.py --output /tmp/neural-pilot.json
      - run: python scripts/realdata_neural_comparison.py
      - run: python scripts/plot_realdata_neural.py
      - run: python scripts/check_realdata_paper.py
      - name: Manuscript figures match the stored paper run
        run: |
          python scripts/check_paper_numbers.py --artifacts artifacts-paper --paper paper/bis_ifc_full.tex --skip eval_counts_precision eval_counts_utility
          python scripts/check_paper_numbers.py --artifacts artifacts-paper --mode quoted \
            --paper paper/publication_versions/jpc_main.tex \
            --source paper/publication_versions/adaptive_audit_toy.json \
                     paper/publication_versions/chain_audit.json paper/publication_versions/audit_process.json artifacts-robustness/robustness.json artifacts-paper/results.json artifacts-sentry/benchmark.json artifacts-neural/neural_pipeline.json \
            --allow-file paper/publication_versions/quoted_allow.txt
