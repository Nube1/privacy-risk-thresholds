name: latex

on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/latex.yml'
  pull_request:
    paths:
      - 'paper/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Long form and online appendix
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: |
            bis_ifc_full.tex
            bis_ifc_online_appendix.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Journal article and supplement (jpc.cls)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/publication_versions
          root_file: |
            jpc_supplement.tex
            jpc_main.tex
            jpc_supplement.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Scenario-injection draft and deployment paper
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: |
            injector_study/main.tex
            deployment/main.tex
          work_in_root_file_dir: true
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Every table and figure is cited in its text
        run: |
          python -m pip install -q -e .
          python scripts/check_float_refs.py paper/bis_ifc_full.tex paper/bis_ifc_online_appendix.tex \
            paper/publication_versions/jpc_main.tex paper/publication_versions/jpc_supplement.tex \
            paper/injector_study/main.tex paper/deployment/main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: manuscripts
          path: |
            paper/bis_ifc_full.pdf
            paper/bis_ifc_online_appendix.pdf
            paper/publication_versions/jpc_main.pdf
            paper/publication_versions/jpc_supplement.pdf
            paper/injector_study/main.pdf
            paper/deployment/main.pdf
