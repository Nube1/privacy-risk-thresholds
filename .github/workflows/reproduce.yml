name: reproduce

on:
  workflow_dispatch:
  push:
    paths: ["src/**", "scripts/**", "configs/**", "book_revised/**", "reproduce.py", "tests/**"]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-fonts-extra texlive-science
      - run: python -m pip install -e ".[dev]" wooldridge
      - run: python reproduce.py --full
      - name: Committed evidence must be what the code produces
        run: git diff --exit-code -- artifacts-paper artifacts-robustness artifacts-extension paper/generated book_revised/generated
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book_revised/main.pdf
